name: ✨ Feature Request
description: Propose a new feature, enhancement, or UI improvement for Nobevra.
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Have an idea to make Nobevra better? Tell us about it below!
  - type: dropdown
    id: component
    attributes:
      label: Target Component
      description: Which area does this feature relate to?
      options:
        - Web Application (web-app)
        - Mobile Application (Mobile App)
        - Backend & Database / Edge Functions
        - Dynamic QR / Business Cards Engine
        - AI Assistant & Analytics
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: Is your feature request related to a problem? Please describe.
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or feature you'd like to see added.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
